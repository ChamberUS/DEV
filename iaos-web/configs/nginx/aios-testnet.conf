# AIOS/BYX Testnet reverse proxy (Nginx)
# - Expõe /rpc, /rest e /faucet com CORS básico
# - Inclui rate limit simples para faucet
#
# Ajuste:
# - server_name
# - upstreams (rpc/rest/faucet)
# - TLS (recomendado em produção)

limit_req_zone $binary_remote_addr zone=faucet_rl:10m rate=5r/m;

upstream byx_rpc_upstream {
  server 127.0.0.1:26657;
  keepalive 64;
}

upstream byx_rest_upstream {
  server 127.0.0.1:1317;
  keepalive 64;
}

upstream aios_faucet_upstream {
  server 127.0.0.1:8000;
  keepalive 16;
}

server {
  listen 80;
  server_name testnet.aios.example;

  # Se for usar HTTPS, configure aqui (certbot/ACME) e mova para 443.
  # listen 443 ssl http2;

  client_max_body_size 2m;

  # CORS básico (para web apps); refine conforme necessário.
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
  add_header Access-Control-Expose-Headers "Content-Length, Content-Type" always;

  if ($request_method = OPTIONS) {
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
  }

  # Conveniência: /rpc -> /rpc/
  location = /rpc { return 301 /rpc/; }
  location = /rest { return 301 /rest/; }
  location = /faucet { return 301 /faucet/; }

  # Tendermint RPC (ex.: /rpc/status)
  location /rpc/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_pass http://byx_rpc_upstream/;
  }

  # Cosmos REST (ex.: /rest/cosmos/tx/v1beta1/txs)
  location /rest/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_pass http://byx_rest_upstream/;
  }

  # Faucet (serviço separado)
  location /faucet/ {
    # Rate limit simples para reduzir abuso (ajuste conforme necessário).
    limit_req zone=faucet_rl burst=10 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_pass http://aios_faucet_upstream/;
  }
}

