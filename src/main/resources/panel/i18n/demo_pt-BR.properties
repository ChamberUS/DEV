demo.faqMarketBody=Não. Todos os valores de mercado são gerados localmente. A DEMO não pode conectar uma conta nem enviar ordens.
demo.faqLanguageTitle=Como altero o idioma?
demo.faqLanguageBody=Escolha Português (Brasil) ou English no seletor de idioma. O texto muda imediatamente, sem precisar entrar novamente.
demo.faqPreferencesTitle=Quais preferências são salvas?
demo.faqPreferencesBody=Somente preferências de idioma, tema, densidade e movimento são salvas no perfil visual da DEMO. Credenciais e autorização nunca são salvas.
demo.faqWindowTitle=Posso redimensionar a janela?
demo.faqWindowBody=Use a borda e a barra de título padrão do Windows para redimensionar, minimizar, maximizar e restaurar. Áreas de conteúdo menores permitem rolagem.
